name: EPUB annotator

description: Generate EPUB footnotes using Gemini for unfamiliar words and phrases

inputs:
  epub_path:
    description: Path to the source EPUB file in the repo
    required: true
  output_path:
    description: Path for the annotated EPUB output
    required: false
    default: annotated.epub
  gemini_api_key:
    description: Gemini API key
    required: true
  gemini_model:
    description: Gemini model to use
    required: false
    default: gemini-2.0-flash
  chunk_size_chars:
    description: Maximum number of characters to send to Gemini per request
    required: false
    default: '12000'

runs:
  using: composite
  steps:
    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install beautifulsoup4

    - name: Run EPUB annotation
      shell: bash
      env:
        INPUT_EPUB_PATH: ${{ inputs.epub_path }}
        OUTPUT_EPUB_PATH: ${{ inputs.output_path }}
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GEMINI_MODEL: ${{ inputs.gemini_model }}
        CHUNK_SIZE_CHARS: ${{ inputs.chunk_size_chars }}
      run: |
        python "${{ github.action_path }}/annotate_epub.py"
